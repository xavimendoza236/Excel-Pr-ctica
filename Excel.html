<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HojaClara - Excel practica</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        .toolbar {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 6px 12px;
            background-color: #107C41;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background-color: #0b582e;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
            background: rgb(230, 219, 219);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        thead, tr td:first-child {
            background: #fbff009f;
            font-weight: bold;
            color: #000000c0;
        }

        th, td {
            border: 1px solid #d0d7de;
            font-weight: normal;
            font-size: 12px;
            text-align: center;
            width: 75px;
            height: 24px;
            vertical-align: middle;
            position: relative;
        }

        span, input {
            position: absolute;
            inset: 0;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 0 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        input {
            border: 0;
            opacity: 0;
            pointer-events: none;
            width: 100%;
            background: #fff;
            z-index: 10;
        }

        input:focus {
            opacity: 1;
            pointer-events: auto;
            outline: 2px solid #107C41;
        }

        .selected {
            background: #e8f4fd !important;
        }

        .negative {
            color: #d9381e;
            font-weight: bold;
        }

        .error-cell {
            color: #b30000;
            background-color: #fde8e8;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
        <img src="https://yusif.az/main/wp-content/uploads/2020/12/ex.png" alt="Logo" style="width: 45px; height: 45px;">

        <h2 style="margin: 0; color: #107C41;">HojaClara - Práctica N.o1</h2>
    </div>

    <div class="toolbar">
        <button id="btn-export">Exportar CSV</button>
        <button id="btn-clear">Limpiar Hoja</button>
    </div>

    <table>
        <thead></thead>
        <tbody></tbody>
    </table>

    <script type="module">
        const $ = el => document.querySelector(el);
        const $$ = el => document.querySelectorAll(el);

        const $table = $('table');
        const $head = $('thead');
        const $body = $('tbody');

        const ROWS = 15;
        const COLUMNS = 10;
        const FIRST_CHAR_CODE = 65;

        const times = length => Array.from({ length }, (_, i) => i);
        const getColumn = i => String.fromCharCode(FIRST_CHAR_CODE + i);

        let selectedColumn = null;

        // Inicializamos con computedValue y value vacíos por defecto
        let STATE = loadState() || times(COLUMNS).map(i => times(ROWS).map(j => ({ computedValue: '', value: '' })));

        function saveState() {
            localStorage.setItem('hojaclara_state', JSON.stringify(STATE));
        }

        function loadState() {
            const saved = localStorage.getItem('hojaclara_state');
            return saved ? JSON.parse(saved) : null;
        }

        function updateCell({ x, y, value }) {
            const newState = structuredClone(STATE);
            newState[x][y].value = value;

            try {
                computeAllCells(newState);
                STATE = newState;
                saveState();
            } catch (e) {
                alert(e.message);
            }
            renderSpreadSheet();
        }

        function computeAllCells(cells) {
            times(COLUMNS).forEach(x => {
                times(ROWS).forEach(y => {
                    const cell = cells[x][y];
                    cell.computedValue = evaluateExpression(cell.value, cells, x, y, new Set());
                });
            });
        }

        function evaluateExpression(value, cells, x, y, visited) {
            if (value === '' || value === null || value === undefined) return '';
            if (typeof value === 'number') return value;
            
            const stringVal = String(value).trim();
            if (stringVal === '') return '';
            if (!stringVal.startsWith('=')) {
                const num = Number(stringVal);
                return isNaN(num) ? stringVal : num;
            }

            const formula = stringVal.slice(1).trim();
            const cellId = `${getColumn(x)}${y + 1}`;
            
            if (visited.has(cellId)) {
                return '#CIRCULAR!';
            }
            visited.add(cellId);

            try {
                return parseAndEvaluate(formula, cells, visited);
            } catch (err) {
                return '#ERROR!';
            }
        }

        function parseAndEvaluate(formula, cells, visited) {
            const funcRegex = /^(SUMA|PROMEDIO|MAX|MIN)\(([A-Z][0-9]+):([A-Z][0-9]+)\)$/i;
            const match = formula.match(funcRegex);
            if (match) {
                const funcName = match[1].toUpperCase();
                const startCell = match[2];
                const endCell = match[3];
                const values = getRangeValues(startCell, endCell, cells, visited);
                return calculateFunction(funcName, values);
            }

            let evaluatedFormula = formula.replace(/[A-Z][0-9]+/g, (matchRef) => {
                const refCoords = cellIdToCoords(matchRef);
                if (!refCoords) return 0;
                const val = evaluateExpression(cells[refCoords.x][refCoords.y].value, cells, refCoords.x, refCoords.y, new Set(visited));
                if (val === '') return 0;
                if (typeof val === 'string' && val.startsWith('#')) throw new Error(val);
                return Number(val) || 0;
            });

            return evaluateArithmetic(evaluatedFormula);
        }

        function cellIdToCoords(cellId) {
            const match = cellId.match(/^([A-Z])([0-9]+)$/);
            if (!match) return null;
            const x = match[1].charCodeAt(0) - FIRST_CHAR_CODE;
            const y = parseInt(match[2], 10) - 1;
            if (x < 0 || x >= COLUMNS || y < 0 || y >= ROWS) return null;
            return { x, y };
        }

        function getRangeValues(start, end, cells, visited) {
            const startC = cellIdToCoords(start);
            const endC = cellIdToCoords(end);
            if (!startC || !endC) return [];
            
            const minX = Math.min(startC.x, endC.x);
            const maxX = Math.max(startC.x, endC.x);
            const minY = Math.min(startC.y, endC.y);
            const maxY = Math.max(startC.y, endC.y);

            const values = [];
            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    const val = evaluateExpression(cells[x][y].value, cells, x, y, new Set(visited));
                    if (typeof val === 'number') values.push(val);
                }
            }
            return values;
        }

        function calculateFunction(func, values) {
            if (values.length === 0) return 0;
            switch (func) {
                case 'SUMA': return values.reduce((a, b) => a + b, 0);
                case 'PROMEDIO': return values.reduce((a, b) => a + b, 0) / values.length;
                case 'MAX': return Math.max(...values);
                case 'MIN': return Math.min(...values);
                default: return 0;
            }
        }

        function evaluateArithmetic(expr) {
            expr = expr.replace(/\s+/g, '');
            try {
                return Function('"use strict"; return (' + expr + ')')();
            } catch (e) {
                return '#ERROR!';
            }
        }

        const renderSpreadSheet = () => {
            const headerHTML = `<tr>
                <th></th>
                ${times(COLUMNS).map(i => `<th>${getColumn(i)}</th>`).join('')}
            </tr>`;
            $head.innerHTML = headerHTML;

            const bodyHTML = times(ROWS).map(row => {
                return `<tr>
                    <td>${row + 1}</td>
                    ${times(COLUMNS).map(column => {
                        const cell = STATE[column][row];
                        const val = cell.computedValue;
                        const isError = typeof val === 'string' && val.startsWith('#');
                        const isNeg = typeof val === 'number' && val < 0;
                        const cssClass = isError ? 'error-cell' : (isNeg ? 'negative' : '');
                        return `
                        <td data-x="${column}" data-y="${row}" class="${cssClass}">
                            <span>${val}</span>
                            <input type="text" value="${cell.value ?? ''}" />
                        </td>`;
                    }).join('')}
                </tr>`;
            }).join('');
            $body.innerHTML = bodyHTML;
        };

        function commitInput(input, x, y) {
            const newVal = input.value;
            if (newVal !== String(STATE[x][y].value)) {
                updateCell({ x, y, value: newVal });
            }
        }

        function focusCell(x, y) {
            const cellTd = $body.querySelector(`td[data-x="${x}"][data-y="${y}"]`);
            if (cellTd) {
                const input = cellTd.querySelector('input');
                if (input) {
                    input.focus();
                    input.setSelectionRange(input.value.length, input.value.length);
                }
            }
        }

        $body.addEventListener('keydown', event => {
            const input = event.target.closest('input');
            if (!input) return;

            const td = input.closest('td');
            if (!td) return;

            let x = Number(td.dataset.x);
            let y = Number(td.dataset.y);

            if (event.key === 'Enter') {
                event.preventDefault();
                commitInput(input, x, y);
                y = Math.min(ROWS - 1, y + 1);
                focusCell(x, y);
            } else if (event.key === 'Tab') {
                event.preventDefault();
                commitInput(input, x, y);
                x = (x + 1) % COLUMNS;
                focusCell(x, y);
            } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
                commitInput(input, x, y);
                if (event.key === 'ArrowDown') y = Math.min(ROWS - 1, y + 1);
                if (event.key === 'ArrowUp') y = Math.max(0, y - 1);
                if (event.key === 'ArrowRight') x = Math.min(COLUMNS - 1, x + 1);
                if (event.key === 'ArrowLeft') x = Math.max(0, x - 1);
                focusCell(x, y);
                event.preventDefault();
            }
        });

        $body.addEventListener('focusout', event => {
            const input = event.target.closest('input');
            if (!input) return;
            const td = input.closest('td');
            if (!td) return;
            commitInput(input, Number(td.dataset.x), Number(td.dataset.y));
        }, true);

        $body.addEventListener('click', event => {
            const td = event.target.closest('td');
            if (!td) return;
            const { x, y } = td.dataset;
            const input = td.querySelector('input');
            if (input && document.activeElement !== input) {
                input.focus();
                input.setSelectionRange(input.value.length, input.value.length);
            }

            $$('.selected').forEach(el => el.classList.remove('selected'));
            selectedColumn = null;
        });

        $head.addEventListener('click', event => {
            const th = event.target.closest('th');
            if (!th) return;
            const x = [...th.parentNode.children].indexOf(th);
            if (x <= 0) return;

            selectedColumn = x - 1;
            $$('.selected').forEach(el => el.classList.remove('selected'));
            th.classList.add('selected');
            $$(`tr td:nth-child(${x + 1})`).forEach(el => el.classList.add('selected'));
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Backspace' && selectedColumn !== null && document.activeElement.tagName !== 'INPUT') {
                times(ROWS).forEach(row => {
                    STATE[selectedColumn][row].value = '';
                    STATE[selectedColumn][row].computedValue = '';
                });
                saveState();
                renderSpreadSheet();
            }
        });

        $('#btn-export').addEventListener('click', () => {
            let csvContent = "data:text/csv;charset=utf-8,";
            const rowsData = times(ROWS).map(y => {
                return times(COLUMNS).map(x => STATE[x][y].computedValue).join(",");
            });
            csvContent += rowsData.join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "hojaclara_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        $('#btn-clear').addEventListener('click', () => {
            if (confirm("¿Estás seguro de limpiar toda la hoja?")) {
                STATE = times(COLUMNS).map(i => times(ROWS).map(j => ({ computedValue: '', value: '' })));
                saveState();
                renderSpreadSheet();
            }
        });

        document.addEventListener('click', event => {
            const { target } = event;
            if (!target.closest('th') && !target.closest('td') && !target.closest('button')) {
                $$('.selected').forEach(el => el.classList.remove('selected'));
                selectedColumn = null;
            }
        });

        computeAllCells(STATE);
        renderSpreadSheet();
    </script>
</body>
</html>
